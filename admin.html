<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | Explore Kenya</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="admin-header">

    <h1>Explore Kenya</h1>

    <p>Admin Dashboard</p>

</header>


<main class="admin-container">

    <div class="admin-top">

        <div>
            <h2>Bookings</h2>

            <p>
                Manage your customer booking requests.
            </p>
        </div>

        <button
            class="btn"
            onclick="loadBookings()"
        >
            Refresh
        </button>

    </div>


   <div class="stats-container">

    <div class="booking-stat">

        <span>Total Bookings</span>

        <strong id="bookingCount">
            0
        </strong>

    </div>


    <div class="booking-stat">

        <span>Total Travelers</span>

        <strong id="travelerCount">
            0
        </strong>

    </div>

</div>

<div class="booking-tools">

    <input
        type="text"
        id="searchInput"
        placeholder="Search by name, email or tour..."
    >

    <button
        class="btn"
        onclick="loadBookings()"
    >
        Refresh
    </button>

    <button
        class="logout-btn"
        onclick="logout()"
    >
        Logout
    </button>

</div>


   <div class="table-container">

    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Tour</th>
                <th>People</th>
                <th>Date</th>
                <th>Message</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="bookingTable">

        </tbody>

    </table>

</div>

</main>


<script>

let allBookings = [];


async function loadBookings() {

    try {

        const response =
            await fetch("/api/bookings");


        if (!response.ok) {

            window.location.href =
                "/admin-login.html";

            return;

        }


        allBookings =
            await response.json();


        displayBookings(allBookings);

        updateStats(allBookings);


    } catch (error) {

        console.error(error);

    }

}


function displayBookings(bookings) {

    const table =
        document.getElementById("bookingTable");


    table.innerHTML = "";


    bookings.forEach(function(booking) {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${booking.id}</td>

            <td>${booking.name}</td>

            <td>${booking.email}</td>

            <td>${booking.phone}</td>

            <td>${booking.tour}</td>

            <td>${booking.people}</td>

            <td>${booking.date}</td>

            <td>${booking.message || ""}</td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deleteBooking(${booking.id})"
                >
                    Delete
                </button>

            </td>

        `;


        table.appendChild(row);

    });

}


function updateStats(bookings) {

    document.getElementById("bookingCount")
        .textContent = bookings.length;


    const totalTravelers =
        bookings.reduce(
            function(total, booking) {

                return total +
                    Number(booking.people);

            },
            0
        );


    document.getElementById("travelerCount")
        .textContent = totalTravelers;

}


document.getElementById("searchInput")
    .addEventListener("input", function() {

        const search =
            this.value.toLowerCase();


        const filtered =
            allBookings.filter(function(booking) {

                return (

                    booking.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    booking.email
                        .toLowerCase()
                        .includes(search)

                    ||

                    booking.tour
                        .toLowerCase()
                        .includes(search)

                );

            });


        displayBookings(filtered);

    });


async function deleteBooking(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this booking?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/bookings/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (data.success) {

            loadBookings();

        }

    } catch (error) {

        console.error(error);

    }

}


async function logout() {

    await fetch(
        "/api/admin/logout",
        {
            method: "POST"
        }
    );


    window.location.href =
        "/admin-login.html";

}


loadBookings();

</script>

</body>

</html>
