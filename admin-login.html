<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Explore Kenya</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<main class="login-container">

    <div class="login-box">

        <h1>Explore Kenya</h1>

        <h2>Admin Login</h2>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >


            <button
                type="submit"
                class="btn"
            >
                Login
            </button>

        </form>


        <p id="loginMessage"></p>

    </div>

</main>


<script>

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    try {

        const response = await fetch(
            "/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            }
        );


        const data =
            await response.json();


        if (data.success) {

            window.location.href =
                "/admin.html";

        } else {

            loginMessage.textContent =
                data.message;

        }

    } catch (error) {

        console.error(error);

        loginMessage.textContent =
            "Unable to connect to the server.";

    }

});

</script>

</body>

</html>
